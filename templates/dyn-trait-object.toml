root_cause = ["trait 没有编译期大小，不能直接作为值/元素的类型", "Box<dyn Shape> 用指针承载大小未知的实现者，异构集合由此成立"]
misconceptions = ["以为 trait 可以像具体类型一样存进集合", "以为 Box::new 之后类型就自动统一"]
