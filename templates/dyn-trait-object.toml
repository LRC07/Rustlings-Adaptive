reference = '''
use std::f64::consts::PI;

trait Shape {
    fn area(&self) -> f64;
}

struct Circle {
    r: f64,
}

impl Shape for Circle {
    fn area(&self) -> f64 {
        PI * self.r * self.r
    }
}

struct Square {
    a: f64,
}

impl Shape for Square {
    fn area(&self) -> f64 {
        self.a * self.a
    }
}

pub fn total(shapes: &[Box<dyn Shape>]) -> f64 {
    shapes.iter().map(|s| s.area()).sum()
}

pub fn main_flow() -> f64 {
    let shapes: Vec<Box<dyn Shape>> =
        vec![Box::new(Circle { r: {{r}} }), Box::new(Square { a: {{a}} })];
    total(&shapes)
}
'''

