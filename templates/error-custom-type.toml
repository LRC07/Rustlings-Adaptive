tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    fn cfg_with(v: &str) -> Config {
        let mut m = HashMap::new();
        m.insert("timeout".to_string(), v.to_string());
        Config { map: m }
    }

    #[test]
    fn parses_timeout() {
        assert!(get_timeout(&cfg_with("{{secs}}")).is_ok_and(|v| v == {{secs}}));
    }

    #[test]
    fn missing_key_reports_custom_error() {
        let cfg = Config { map: HashMap::new() };
        let err = get_timeout(&cfg).unwrap_err();
        assert_eq!(format!("{err}"), "缺少配置项: timeout");
        let _: &dyn std::error::Error = &err;
    }

    #[test]
    fn bad_value_reports_custom_error() {
        let err = get_timeout(&cfg_with("{{bad}}")).unwrap_err();
        assert_eq!(format!("{err}"), "不是数字: {{bad}}");
    }
}
'''

reference = '''
use std::collections::HashMap;
use std::fmt;

#[derive(Debug)]
pub enum ConfigError {
    Missing(String),
    NotANumber(String),
}

impl fmt::Display for ConfigError {
    fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
        match self {
            ConfigError::Missing(k) => write!(f, "缺少配置项: {k}"),
            ConfigError::NotANumber(v) => write!(f, "不是数字: {v}"),
        }
    }
}

impl std::error::Error for ConfigError {}

pub struct Config {
    pub map: HashMap<String, String>,
}

pub fn get_timeout(cfg: &Config) -> Result<u64, ConfigError> {
    let raw = cfg
        .map
        .get("timeout")
        .ok_or_else(|| ConfigError::Missing("timeout".to_string()))?;
    raw.parse::<u64>()
        .map_err(|_| ConfigError::NotANumber(raw.clone()))
}
'''

