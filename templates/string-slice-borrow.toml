# 批次一 #9b（M4.5d）：String 与 &str ×2：返回切片零分配（medium）
id = "string-slice-borrow"
title = "String 与 &str：返回切片而不是分配新串"
concepts = ["types.strings"]
error_codes = ["E0308"]
difficulty = "medium"
constraints = ["no-clone", "max-lines=40"]
confusion = "Java 的 substring 返回新对象（看似免费）；初学者写 Rust 也随手 to_owned 分配，忘了「借一段出去」用切片就行——返回引用的寿命跟着输入走"
anti_patterns = ["to-owned-escape"]
hints = ["&str 是「指向原串的一段」——切片语法直接表达。", "s[start..end] 范围语法；len 已备好。", "&s[..len] 对空串同样合法。"]

body = '''
// 分析首词：返回它的长度与切片本身（零分配）。
// 首词就在原串里，没有必要为它再分配一份内存——
// 返回「指向原串的一段」即可，这正是切片存在的意义。
//
// TODO: 补全 analyze 的第二返回值：从原串借用首词的切片（零分配）。
//       空串也要能工作。禁止 to_owned/clone。
pub fn analyze(s: &str) -> (usize, &str) {
    let len = s.split_whitespace().next().map(|w| w.len()).unwrap_or(0);
    (len, todo!())
}
// I AM NOT DONE
'''

tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn first_word_slice() {
        assert_eq!(analyze("hello world"), (5, "hello"));
    }

    #[test]
    fn empty_is_empty() {
        assert_eq!(analyze(""), (0, ""));
    }
}
'''

reference = '''
pub fn analyze(s: &str) -> (usize, &str) {
    let len = s.split_whitespace().next().map(|w| w.len()).unwrap_or(0);
    (len, &s[..len])
}
'''


[review_hints]
root_cause = [
    "返回从原串借用的切片：split_whitespace().next().unwrap_or(空串) 的类型是 &str，与输入同寿命、零分配；空输入回退空切片",
    "元组返回 (usize, &str)：长度是计算值，切片是借用视图——两者的生命周期要求不同",
]
misconceptions = [
    "以为要把首词 to_string() 再返回引用（悬垂，局部 String 出函数即亡）",
    "以为切片是拷贝（切片只是原串的借用视图）",
    "空输入时 unwrap 直接 panic（unwrap_or(空串) 兜底）",
]
