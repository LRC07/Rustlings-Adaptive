    #[test]
    fn parses_head() {
        assert!(matches!(parse_head("42,7"), Ok(42)));
    }

    #[test]
    fn bad_number_is_displayable_error() {
        let e = parse_head("x,7").unwrap_err();
        assert!(matches!(e, ParseError::NotANumber));
        assert!(!format!("{e}").is_empty());
    }
}
