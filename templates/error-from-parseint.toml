anti_patterns = ["map-err-everywhere", "unwrap-ladder"]

body = '''
// 解析 CSV 的第一列数字。想让 ? 直接把 ParseIntError 变成
// ParseError —— 现在还差一个 From 实现（编译器的 E0277 会指出）。
//
// TODO:
//   1. 为 ParseError 实现 fmt::Display 与 std::error::Error
//   2. 实现 From<std::num::ParseIntError> for ParseError（变体 NotANumber）
//   3. parse_head 保持不变（? 会自动转换）
// 禁止 unwrap/expect。
use std::fmt;

#[derive(Debug)]
pub enum ParseError {
    NotANumber,
}

pub fn parse_head(raw: &str) -> Result<i32, ParseError> {
    let head = raw.split(',').next().ok_or(ParseError::NotANumber)?;
    Ok(head.parse::<i32>()?)
}
// I AM NOT DONE
'''

tests = '''
