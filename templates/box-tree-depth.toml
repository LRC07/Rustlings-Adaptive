tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    fn leaf(v: i32) -> Tree {
        Tree { value: v, children: None }
    }

    #[test]
    fn leaf_depth_is_zero() {
        assert_eq!(depth(&leaf(1)), 0);
    }

    #[test]
    fn three_levels_is_two() {
        let t = Tree {
            value: 0,
            children: Some((
                Box::new(leaf(1)),
                Box::new(Tree { value: 2, children: Some((Box::new(leaf(3)), Box::new(leaf(4)))) }),
            )),
        };
        assert_eq!(depth(&t), 2);
    }
}
'''

reference = '''
pub struct Tree {
    pub value: i32,
    pub children: Option<(Box<Tree>, Box<Tree>)>,
}

pub fn depth(t: &Tree) -> usize {
    match &t.children {
        None => 0,
        Some((l, r)) => 1 + depth(l).max(depth(r)),
    }
}
'''
