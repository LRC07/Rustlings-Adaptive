# 批次一 #10b（M4.5d）：派生与核心 trait ×2：当 HashMap 的键（medium）
id = "derive-hashmap-key"
title = "derive：让枚举能当 HashMap 的键"
concepts = ["traits.derive"]
error_codes = ["E0277"]
difficulty = "medium"
constraints = ["no-clone", "max-lines=40"]
confusion = "Python 的任意可哈希对象都能当 dict 键；Java 要求 equals/hashCode 成对实现。Rust 把要求摆在明面上：键要 Eq + Hash，打印要 Debug——少一个都编译不过"
anti_patterns = ["stringly-typed-key", "manual-hash"]
hints = ["HashMap 的键要求 Eq + Hash（见 entry 的 bound 报错）。", "打印要 Debug，比较要 PartialEq。", "全部能 derive，一行列全。"]

body = '''
// 把标签当 HashMap 的键来计数 —— 编译器会逐个指出缺的 trait。
//
// TODO: 给 Tag 补一行 derive（想清楚：做键要什么？打印要什么？
//       == 比较要什么？），其余代码不动。
#[derive(Clone)]
pub enum Tag {
    Bug,
    Doc,
    Perf,
}

pub fn count_tags(tags: Vec<Tag>) -> std::collections::HashMap<Tag, usize> {
    let mut counts = std::collections::HashMap::new();
    for t in tags {
        *counts.entry(t).or_insert(0) += 1;
    }
    counts
}
// I AM NOT DONE
'''

tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn counts_by_tag() {
        let counts = count_tags(vec![Tag::Bug, Tag::Bug, Tag::Doc]);
        assert_eq!(counts.get(&Tag::Bug), Some(&2));
        assert_eq!(counts.get(&Tag::Doc), Some(&1));
    }

    #[test]
    fn printable() {
        assert!(format!("{:?}", Tag::Perf).contains("Perf"));
    }
}
'''

reference = '''
#[derive(Clone, Debug, PartialEq, Eq, Hash)]
pub enum Tag {
    Bug,
    Doc,
    Perf,
}

pub fn count_tags(tags: Vec<Tag>) -> std::collections::HashMap<Tag, usize> {
    let mut counts = std::collections::HashMap::new();
    for t in tags {
        *counts.entry(t).or_insert(0) += 1;
    }
    counts
}
'''


[review_hints]
root_cause = [
    "HashMap<K, V> 的 bound 要求 K: Eq + Hash（定位与去重），打印键还要 Debug——枚举全部可 derive，一行带齐",
    "Eq 与 Hash 必须一致（相等的键哈希必须相同），derive 合成的实现天然一致，不用担心",
]
misconceptions = [
    "以为任意类型都能当 HashMap 键（Python dict 习惯）",
    "以为要把枚举转成 String 当键（丢失类型检查，stringly-typed 反模式）",
    "以为必须手写 impl Hash（derive 即可，手写反而容易写错与 Eq 不一致）",
]
