# 批次一 #12b（M4.5d）：生命周期省略 ×2：悬垂引用改返回 owned（easy）
id = "lifetime-return-owned"
title = "悬垂引用：别返回局部量的引用"
concepts = ["borrowing.dangling"]
error_codes = ["E0515", "E0106", "E0308"]
difficulty = "easy"
constraints = ["no-clone", "max-lines=40"]
confusion = "GC 语言里返回新建对象天经地义；初学者不知道 format! 的结果在函数结束时被 drop，返回 &g 是悬垂引用（E0515）——修法不是延命，而是把所有权交出去"
anti_patterns = ["static-lifetime-escape", "leak-to-live"]
hints = ["format! 的结果在函数结束时 drop——引用会悬垂。", "修法是把所有权交出去（改返回类型）。", "main_flow 期待 String——签名改后调用点不用动。"]

body = '''
// greeting 拼出问候语再返回 —— 但返回的是局部量的引用（E0515）。
//
// TODO: 修好悬垂（编译器说不能返回局部量的引用）。
//       调用方的用法（main_flow）保持不变。
fn greeting(name: &str) -> &str {
    let g = format!("Hello, {name}!");
    &g
}

pub fn main_flow() -> String {
    greeting("alice")
}
// I AM NOT DONE
'''

tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn greets() {
        assert_eq!(main_flow(), "Hello, alice!");
    }

    #[test]
    fn greets_empty_name() {
        assert_eq!(greeting(""), "Hello, !");
    }
}
'''

reference = '''
fn greeting(name: &str) -> String {
    let g = format!("Hello, {name}!");
    g
}

pub fn main_flow() -> String {
    greeting("alice")
}
'''


[review_hints]
root_cause = [
    "不能返回局部 String 的引用（函数返回它就销毁）：正确做法是返回 owned String 把所有权交出去，或返回与输入同寿命的切片",
    "greeting 拼接结果天然是新分配的 String，返回它不丢性能——该 owned 就 owned",
]
misconceptions = [
    "以为把引用标成 'static 就能修（局部量根本没有 'static）",
    "以为返回 String 是性能浪费（这正是所有权转移的用途）",
    "以为引用与值可以随意互换返回类型（谁拥有数据决定了寿命）",
]
