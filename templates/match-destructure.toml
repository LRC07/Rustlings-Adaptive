# 批次一 #4b（M4.5d）：模式匹配 ×2：解构枚举数据
id = "match-destructure"
title = "模式匹配：一次解构枚举携带的数据"
concepts = ["patterns.basics"]
error_codes = ["E0005", "E0308"]
difficulty = "medium"
constraints = ["no-clone", "max-lines=40"]
confusion = "初学者倾向先用 unwrap 拿出值再用字段访问，或嵌套 if let；忘了 match 的模式能在拆开变体的同时完成字段绑定"
anti_patterns = ["unwrap-first-then-use", "nested-if-let"]
hints = ["模式已把 x/y/c 绑定好，直接用。", "数字转 String 用 to_string()。", "char 的 to_uppercase() 返回迭代器，需要收尾成 String。"]

body = '''
// UI 事件：把点击坐标求和、把按键字符转大写。
//
// TODO: 在两个分支里补全逻辑：Click 返回坐标和的字符串，
//         Key 返回字符的大写形式（返回类型都是 String）。
#[derive(Debug)]
pub enum Event {
    Click { x: i32, y: i32 },
    Key(char),
}

pub fn describe(e: &Event) -> String {
    match e {
        Event::Click { x, y } => todo!(),
        Event::Key(c) => todo!(),
    }
}
// I AM NOT DONE
'''

tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn click_sums_coords() {
        assert_eq!(describe(&Event::Click { x: 3, y: 4 }), "7");
    }

    #[test]
    fn key_uppercases() {
        assert_eq!(describe(&Event::Key('r')), "R");
    }
}
'''

reference = '''
#[derive(Debug)]
pub enum Event {
    Click { x: i32, y: i32 },
    Key(char),
}

pub fn describe(e: &Event) -> String {
    match e {
        Event::Click { x, y } => (x + y).to_string(),
        Event::Key(c) => c.to_uppercase().to_string(),
    }
}
'''


[review_hints]
root_cause = [
    "match 分支模式可以直接解构：Event::Click { x, y } 把字段绑定为局部变量，Event::Key(c) 绑定 char——绑定后按题意返回坐标和与大写字母",
    "绑定模式是 match 的常态用法，不需要访问器也不需要二次 match",
]
misconceptions = [
    "以为枚举字段能像结构体那样点出来（先解构才有字段）",
    "以为分支里只能匹配常量（绑定模式才是主力）",
    "先用 _ 丢掉 payload 再想办法取回（已经丢了，直接绑定）",
]
