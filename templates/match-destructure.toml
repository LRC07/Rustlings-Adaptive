reference = '''
#[derive(Debug)]
pub enum Event {
    Click { x: i32, y: i32 },
    Key(char),
}

pub fn describe(e: &Event) -> String {
    match e {
        Event::Click { x, y } => (x + y).to_string(),
        Event::Key(c) => c.to_uppercase().to_string(),
    }
}
