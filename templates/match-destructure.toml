body = '''
// UI 事件：把点击坐标求和、把按键字符转大写。
//
// TODO: 在两个分支里补全逻辑（模式已解构出 x/y 与 c）：
//         * Click { x, y } → (x + y).to_string()
//         * Key(c)         → c.to_uppercase().to_string()
#[derive(Debug)]
pub enum Event {
    Click { x: i32, y: i32 },
    Key(char),
}

pub fn describe(e: &Event) -> String {
    match e {
        Event::Click { x, y } => todo!(),
        Event::Key(c) => todo!(),
    }
}
