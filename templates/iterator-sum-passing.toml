# 批次一 #1a（M4.5d）：迭代器链 ×1：filter + sum 替代手写循环
id = "iterator-sum-passing"
title = "迭代器链：filter + sum 替代手写循环"
concepts = ["iterators.adapters"]
error_codes = ["E0277", "E0282"]
difficulty = "easy"
constraints = ["iterator-only", "no-clone", "max-lines=40"]
confusion = "C/Java 的求和过滤就是 for + if 累加；Python 的 sum(gen) 语法形似但不同——初学者不知道 Rust 的适配器能逐段组合成一条链"
anti_patterns = ["manual-loop"]
hints = ["这一步可以用迭代器适配器表达，而不是手写循环。", "filter 的闭包拿到的是引用——解构一次（|&&s|）会更顺手。", "参考链：iter() → filter(...) → sum()。"]

body = '''
