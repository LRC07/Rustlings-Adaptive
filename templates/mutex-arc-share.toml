# 批次三 D1：Rc 不能跨线程——共享可变要 Arc<Mutex>（课件 6.3 / rustlings threads）
id = "mutex-arc-share"
title = "共享可变：Rc 只能在单线程，跨线程要 Arc<Mutex>"
concepts = ["concurrency.shared"]
error_codes = ["E0277"]
difficulty = "medium"
constraints = []
confusion = "刚学完 Rc<RefCell> 的初学者会把同一套搬进多线程；Rc 的引用计数不是原子的，跨线程共享直接被编译器拒绝（E0277 'cannot be sent between threads safely'）—— Send/Sync 的存在让这件事在编译期暴露"
hints = ["报错说 Rc<Mutex<u32>> 不能安全地在线程间发送。", "Rc 的引用计数不是原子的；Arc 是它的线程安全版本。", "use std::sync::Arc，Rc::new → Arc::new，Rc::clone → Arc::clone。"]

body = '''
// 场景：三个线程各给同一个计数器 +1，join 之后读总数。
//
// counter 用了 Rc——它只能在单线程里共享，spawn 处会被
// 拒绝（E0277）。
//
// TODO: 把共享原语换成线程安全版本（lock 的写法不用变）。
use std::rc::Rc;
use std::sync::Mutex;
use std::thread;

pub fn count_together() -> u32 {
    let counter = Rc::new(Mutex::new(0_u32));
    let mut handles = Vec::new();
    for _ in 0..3 {
        let counter = Rc::clone(&counter);
        handles.push(thread::spawn(move || {
            let mut n = counter.lock().unwrap();
            *n += 1;
        }));
    }
    for h in handles {
        h.join().unwrap();
    }
    *counter.lock().unwrap()
}
// I AM NOT DONE
'''

tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn three_threads_three_increments() {
        assert_eq!(count_together(), 3);
    }
}
'''

reference = '''
use std::sync::{Arc, Mutex};
use std::thread;

pub fn count_together() -> u32 {
    let counter = Arc::new(Mutex::new(0_u32));
    let mut handles = Vec::new();
    for _ in 0..3 {
        let counter = Arc::clone(&counter);
        handles.push(thread::spawn(move || {
            let mut n = counter.lock().unwrap();
            *n += 1;
        }));
    }
    for h in handles {
        h.join().unwrap();
    }
    *counter.lock().unwrap()
}
'''

[review_hints]
root_cause = ["Rc 非原子，不满足 Send，不能跨线程共享", "Arc 是线程安全的引用计数；互斥访问仍由 Mutex 保证"]
misconceptions = ["以为 Rc<RefCell> 也能跨线程", "以为 Arc 本身就能可变修改（还需要 Mutex）"]
