# 批次一 #6a（M4.5d）：递归类型与 Box ×1：链表（easy）
id = "box-recursive-list"
title = "Box：递归类型必须有已知大小"
concepts = ["pointers.box"]
error_codes = ["E0072"]
difficulty = "easy"
constraints = ["no-clone", "max-lines=40"]
confusion = "Python/Java 的对象字段引用别的对象是常态，GC 不管类型大小；初学者不知道 Rust 在编译期要算出每个类型的确切大小，递归 enum 直接写会 E0072（无限大小）"
anti_patterns = ["vec-as-list"]
hints = ["E0072：递归类型的大小算不出来。", "把递归部分放进一个最简单的智能指针。", "Box<List> 在 match 里会自动解引用，sum 不用改。"]

body = '''
// 递归链表：编译器报 E0072（递归类型有无限大小）。
//
// TODO: 修好 Node 变体的类型定义（E0072）；
//       sum 已经写好了，类型修复后它会原样工作。
pub enum List {
    Node(i32, List),
    Nil,
}

pub fn sum(list: &List) -> i32 {
    match list {
        List::Node(v, next) => v + sum(next),
        List::Nil => 0,
    }
}
// I AM NOT DONE
'''

tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn sums_nested() {
        let l = List::Node(1, Box::new(List::Node(2, Box::new(List::Nil))));
        assert_eq!(sum(&l), 3);
    }

    #[test]
    fn nil_is_zero() {
        assert_eq!(sum(&List::Nil), 0);
    }
}
'''

reference = '''
pub enum List {
    Node(i32, Box<List>),
    Nil,
}

pub fn sum(list: &List) -> i32 {
    match list {
        List::Node(v, next) => v + sum(next),
        List::Nil => 0,
    }
}
'''


[review_hints]
root_cause = [
    "递归 enum 的大小在编译期算不出来（Node 直接含 Node 是无限套娃，E0072）；Box 是大小已知的指针，把递归部分装箱后整个类型的大小就确定了",
    "sum 走 match 递归：Nil 返 0，Node(count, next) 累加 count 并对 next 继续求和；Box 自动解引用，match 直接可用",
]
misconceptions = [
    "以为像 Java/Python 一样字段引用对象不用管类型大小（GC 思维）",
    "以为要把链表换成 Vec 或把节点 clone 一份才能修（方向错了，装箱即可）",
    "以为 Box 会拷贝里面的值（只是把值放到堆上，访问时自动解引用）",
]
