reference = '''
pub struct Cart {
    items: Vec<String>,
}

impl Cart {
    pub fn new() -> Self {
        Cart { items: Vec::new() }
    }

    pub fn push(&mut self, item: &str) {
        self.items.push(item.to_string());
    }

    pub fn len(&self) -> usize {
        self.items.len()
    }

    pub fn into_items(self) -> Vec<String> {
        self.items
    }
}

pub fn main_flow() -> (usize, Vec<String>) {
    let mut cart = Cart::new();
    cart.push("book");
    cart.push("pen");
    let n = cart.len();
    let items = cart.into_items();
    (n, items)
}
'''
