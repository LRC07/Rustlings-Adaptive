# 批次一 #1b（M4.5d）：迭代器链 ×2：filter + map + collect 组合
id = "iterator-greetings"
title = "迭代器链：filter + map + collect 组合"
concepts = ["iterators.adapters"]
error_codes = ["E0277", "E0283"]
difficulty = "medium"
constraints = ["iterator-only", "no-clone", "max-lines=40"]
confusion = "初学者会先 for 循环 push 到 Vec——忘了 collect 能把适配器链直接收成容器，也容易漏掉 collect 的目标类型标注"
anti_patterns = ["manual-loop", "collect-then-filter"]
hints = ["拆成三步想：跳过空名 → 造问候语 → 收集成 Vec。", "collect 的目标类型可由返回值推断。", "iter() → filter → map → collect 各司其职。"]

body = '''
// 把名字列表整理成问候语：跳过空名，其余变成 "Hi, <name>!"。
// 这条流水线用一条表达式就能写完：不需要可变的临时 Vec，
// 也不需要手写下标边界——数据从一端流到另一端。
//
// TODO: 用迭代器链完成：跳过空名 → 逐个造问候语 → 收集成 Vec。
//       禁止 for/while/loop，禁止 clone，不引入可变暂存。
fn greetings(names: &[&str]) -> Vec<String> {
    todo!()
}
// I AM NOT DONE
'''

tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn skips_empty_and_greets() {
        assert_eq!(greetings(&["alice", "", "bob"]), vec!["Hi, alice!", "Hi, bob!"]);
    }

    #[test]
    fn all_empty_gives_empty() {
        assert_eq!(greetings(&["", ""]), Vec::<String>::new());
    }
}
'''

reference = '''
fn greetings(names: &[&str]) -> Vec<String> {
    names
        .iter()
        .filter(|n| !n.is_empty())
        .map(|n| format!("Hi, {n}!"))
        .collect()
}
'''


[review_hints]
root_cause = [
    "迭代器三段式：iter() → filter(|s| !s.is_empty()) 惰性跳过空名 → map(|s| format!(「Hi, {s}?」)) 逐个造问候 → collect() 收成 Vec",
    "适配器是惰性的：不 collect 就不执行；filter/map 只是描述转换，collect 才驱动",
]
misconceptions = [
    "以为要 for 循环加 push（iterator-only 约束下编译不过，且更冗长）",
    "以为 filter 之后还要先收集成 Vec 再 map（链式一步到位）",
    "collect 的目标类型推断失败就放弃（ turbofish collect::<Vec<_>>() 或 let 绑定标注）",
]
