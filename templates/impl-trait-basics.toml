[[slots]]
name = "cents"
kind = "literal"
values = ["1500", "990", "88"]
default = "1500"

[review_hints]
root_cause = ["泛型约束 T: Pay 在调用点做检查，类型没有对应 impl 就不满足", "Rust 的实现与类型定义分离，需要独立的 impl 块"]
misconceptions = ["以为在 struct 定义处声明“实现了什么”", "以为 trait 方法可以在调用处现场补"]
