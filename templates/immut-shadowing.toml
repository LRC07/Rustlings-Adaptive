# 批次一 #8a（M4.5d）：mut 绑定与遮蔽 ×1：E0384（easy）
id = "immut-shadowing"
title = "可变绑定：改值要 mut，重绑定用遮蔽"
concepts = ["ownership.immut"]
error_codes = ["E0384"]
difficulty = "easy"
constraints = ["no-clone", "max-lines=40"]
confusion = "Python/JS 的 let/const 也能重绑，但没人区分「改原值」与「换新值」；Rust 的默认不可变把这两件事拆开：改原值要 mut，换新值用 shadowing"
anti_patterns = ["mut-everywhere"]
hints = ["E0384：不可变绑定不能二次赋值。", "选一条路走到底：mut 或 shadowing，不要混用。"]

body = '''
// 计数器：count 要累加两次。编译器报 E0384（不可变绑定被二次赋值）。
//
// TODO: 两种修法任选其一：
//         a) 给绑定加 mut（就地累加）
//         b) 每步用 let count = ... 遮蔽重绑（新值，非改旧值）
//       最终返回 2。
pub fn counter() -> i32 {
    let count = 0;
    count += 1;
    count += 1;
    count
}
// I AM NOT DONE
'''

tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn counts_twice() {
        assert_eq!(counter(), 2);
    }
}
'''

reference = '''
pub fn counter() -> i32 {
    let mut count = 0;
    count += 1;
    count += 1;
    count
}
'''


[review_hints]
root_cause = [
    "对不可变绑定重新赋值是 E0384：要么声明 mut 原地改，要么用遮蔽 let n = n + 1 产生新绑定——两种修法语义不同（原地改 vs 新值）",
    "计数器这种需要跨调用保持的应该看题意选 mut；一次性变换用遮蔽更惯用",
]
misconceptions = [
    "以为 let 声明的变量默认可变（Rust 恰恰默认不可变）",
    "以为遮蔽和 mut 赋值是一回事（遮蔽是新变量，mut 是原地修改）",
    "以为数字相加前不用 parse（字符串与数字类型不同）",
]
