# T1 所有权 ×1：按值传参把所有权移走，改借用修复
id = "own-move-basics"
title = "所有权移动：函数拿走所有权后原值不可再用"
concepts = ["ownership.move"]
error_codes = ["E0382"]
difficulty = "easy"
constraints = ["no-clone", "max-lines=30"]

body = '''
// `shout` 和 `measure` 都按值接收 String —— 一旦调用，`title` 就
// 被移动走了，后面的代码会触发 E0382。
//
// TODO: 修改 `shout` / `measure` 的参数为借用（&str），让 main_flow
// 能按测试要求完成三步操作（禁止使用 clone）。
fn shout(msg: String) -> String {
    format!("【{msg}】")
}

fn measure(msg: String) -> usize {
    msg.chars().count()
}

pub fn main_flow() -> (String, usize, String) {
    let title = String::from("{{word}}");
    let a = shout(title);
    let b = measure(title);
    (a, b, title)
}
// I AM NOT DONE
'''

tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn flow_works() {
        let word = "{{word}}";
        let (a, b, t) = main_flow();
        assert_eq!(a, format!("【{word}】"));
        assert_eq!(b, word.chars().count());
        assert_eq!(t, word);
    }

    #[test]
    fn shout_alone() {
        assert_eq!(shout("hi"), "【hi】");
    }
}
'''

reference = '''
fn shout(msg: &str) -> String {
    format!("【{msg}】")
}

fn measure(msg: &str) -> usize {
    msg.chars().count()
}

pub fn main_flow() -> (String, usize, String) {
    let title = String::from("{{word}}");
    let a = shout(&title);
    let b = measure(&title);
    (a, b, title)
}
'''

[[slots]]
name = "word"
kind = "literal"
values = ["rust", "loop", "heap"]
default = "rust"

[review_hints]
root_cause = ["函数按值接收参数会移动所有权", "借用（&）允许使用而不取得所有权"]
misconceptions = ["以为给函数传参总会复制一份", "以为 String 赋值是深拷贝"]
