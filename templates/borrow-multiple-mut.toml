# T4 借用 ×2：同一个 Vec 的可变借用不能有两个（E0499）
id = "borrow-multiple-mut"
title = "可变借用独占：遍历时不能同时 push"
concepts = ["borrowing.multiple-mut"]
error_codes = ["E0499"]
difficulty = "medium"
constraints = ["no-clone", "max-lines=35"]
confusion = "Java/Python 边遍历边修改集合（list.append）是惯用法甚至默认；初学者意识不到 iter_mut() 已借走整个 Vec 的独占借用并存活到循环结束"
anti_patterns = ["clone-then-append"]
hints = ["迭代器的借用贯穿整个 for——循环体内不能再动 scores。", "下标访问是「用完即还」的短借用。", "先记下初始长度，再 for i in 0..len。"]

body = '''
// 给所有低于 pass 的分数加 10 分，返回被加分的人数。
//
// TODO: 修复这个循环——编译器说 scores 在遍历期间被再次可变借用。
//       不许用 clone，不许改函数签名。
fn curve(scores: &mut Vec<i32>, pass: i32) -> usize {
    let mut bumped = 0;
    for s in scores.iter_mut() {
        if *s < pass {
            scores.push(*s + 10);
            bumped += 1;
        }
    }
    bumped
}
// I AM NOT DONE
'''

tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn curves_below_pass_only() {
        let pass = {{pass}};
        let mut v = vec![pass - 10, pass + 5];
        assert_eq!(curve(&mut v, pass), 1);
        assert_eq!(v, vec![pass, pass + 5]);
    }

    #[test]
    fn curves_empty() {
        let mut v: Vec<i32> = Vec::new();
        assert_eq!(curve(&mut v, {{pass}}), 0);
    }
}
'''

reference = '''
fn curve(scores: &mut [i32], pass: i32) -> usize {
    let mut bumped = 0;
    for s in scores.iter_mut() {
        if *s < pass {
            *s += 10;
            bumped += 1;
        }
    }
    bumped
}
'''

[[slots]]
name = "pass"
kind = "literal"
values = ["80", "70"]
default = "80"

[review_hints]
root_cause = ["&mut 借用是独占的", "先把需要的元信息（如长度）取出来，再分阶段可变操作"]
misconceptions = ["以为迭代器和 push 互不相干", "以为把元素 clone 出来才算修复"]
