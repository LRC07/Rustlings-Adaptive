# 批次一 #2b（M4.5d）：Option 组合子 ×2：and_then 剥掉嵌套
id = "option-and-then-chain"
title = "Option 组合子：and_then + map 链式改写"
concepts = ["types.option-result"]
error_codes = ["E0308"]
difficulty = "medium"
constraints = ["no-unwrap", "max-lines=40"]
confusion = "初学者会 map 里嵌 unwrap「绕过」第二层失败——Option<Result<T, E>> 的双层结构要用 and_then 才能干净剥开"
anti_patterns = ["unwrap-ladder", "nested-match"]
hints = ["两步流水线：可能失败的解析 → 纯变换。", "and_then 的闭包返回 Option，map 的返回普通值。", "parse::<i32>().ok() 是 Result → Option 的桥。"]

body = '''
// 两步流水线：解析字符串成数字，再翻倍；任一步失败都返回 None。
// 「可能失败的一步」与「必然成功的变换」要分开处理——
// 用同一个组合子家族把它们串成一条链，中间没有 panic 的余地。
//
// TODO: 现在的实现 parse 失败会 panic（unwrap）。改写成一行：把
//       可能失败的解析与纯变换分开，禁止 unwrap 与 match。
fn doubled(input: Option<&str>) -> Option<i32> {
    input.map(|s| s.parse::<i32>().unwrap() * 2)
}
// I AM NOT DONE
'''

tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn doubles_parsed() {
        assert_eq!(doubled(Some("21")), Some(42));
    }

    #[test]
    fn none_or_unparsable_is_none() {
        assert_eq!(doubled(None), None);
        assert_eq!(doubled(Some("abc")), None);
    }
}
'''

reference = '''
fn doubled(input: Option<&str>) -> Option<i32> {
    input.and_then(|s| s.parse::<i32>().ok()).map(|n| n * 2)
}
'''


[review_hints]
root_cause = [
    "and_then 是惰性组合：只在 Some 时执行闭包，None 直接透传——parse 放进 and_then，失败变 None，一行链式替代 unwrap + match",
    "急切求值（unwrap_or(expr) 参数先算）与惰性（unwrap_or_else / and_then）的区别是本考点核心",
]
misconceptions = [
    "以为 unwrap_or(重计算) 的默认值只在需要时才算（参数急切求值，白算）",
    "以为 and_then 闭包要再包一层 Some（闭包本来就返回 Option）",
    "以为处理 None 必须 match（组合子就是为这个生的）",
]
