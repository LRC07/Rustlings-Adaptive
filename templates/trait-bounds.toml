# T8 trait ×2：泛型函数的 trait 约束（E0277）
id = "trait-bounds"
title = "trait 约束：泛型函数必须声明它需要的能力"
concepts = ["traits.bounds"]
error_codes = ["E0277"]
difficulty = "easy"
constraints = ["no-clone", "max-lines=38"]

body = '''
// summaries 想对"任何能自我描述的类型"工作 —— 但泛型参数 T 没有声明
// 实现 Summary，编译器拒绝调用 summarize（E0277）。
//
// TODO: 给 T 加上 trait 约束（两种写法任选：<T: Summary> 或
//       where T: Summary）。不许用 clone。
pub trait Summary {
    fn summarize(&self) -> String;
}

pub struct Article {
    pub title: String,
}

impl Summary for Article {
    fn summarize(&self) -> String {
        format!("[article] {}", self.title)
    }
}

pub fn summaries<T>(items: &[T]) -> Vec<String> {
    items.iter().map(|it| it.summarize()).collect()
}
// I AM NOT DONE
'''

tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    pub struct Blog {
        pub tag: String,
    }

    impl Summary for Blog {
        fn summarize(&self) -> String {
            format!("[blog] {}", self.tag)
        }
    }

    #[test]
    fn collects_summaries() {
        let arts = vec![Article { title: "{{w1}}".into() }];
        let blogs = vec![Blog { tag: "{{w2}}".into() }];
        let mut all = summaries(&arts);
        all.extend(summaries(&blogs));
        assert_eq!(
            all,
            vec!["[article] {{w1}}".to_string(), "[blog] {{w2}}".to_string()]
        );
    }
}
'''

reference = '''
pub trait Summary {
    fn summarize(&self) -> String;
}

pub struct Article {
    pub title: String,
}

impl Summary for Article {
    fn summarize(&self) -> String {
        format!("[article] {}", self.title)
    }
}

pub fn summaries<T: Summary>(items: &[T]) -> Vec<String> {
    items.iter().map(|it| it.summarize()).collect()
}
'''

