[[slots]]
name = "note"
kind = "literal"
values = ["audit", "check", "review"]
default = "audit"

[review_hints]
root_cause = ["可变借用要求独占", "共享借用的存活范围由最后一次使用决定（NLL）"]
misconceptions = ["以为借用规则以行为单位而不是以作用域为单位", "以为 clone 是修复借用错误的唯一办法"]
