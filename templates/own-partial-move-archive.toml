# 批次一 #7b（M4.5d）：部分移动 ×2：解构重建（medium）
id = "own-partial-move-archive"
title = "部分移动：取走 token，其余字段归档"
concepts = ["ownership.partial-move"]
error_codes = ["E0382"]
difficulty = "medium"
constraints = ["no-clone", "max-lines=40"]
confusion = "「拿走一个字段、留下其余」在 GC 语言里是免费操作；Rust 里要么解构、要么 clone——no-clone 约束逼你用解构，而部分移动规则决定之后还能用哪些字段"
anti_patterns = ["clone-everywhere"]
hints = ["解构之后再组装新结构体。", "Archive { user, expires_at } 用字段简写即可。", "token 搬走后 session 就不能再整体使用。"]

