[[slots]]
name = "ok"
kind = "literal"
values = ["30", "0", "150"]
default = "30"

[review_hints]
root_cause = ["TryFrom 的关联类型是 Error，写错名字就是“trait 没有这个成员”", "可能失败的转换用 TryFrom + Err，而不是 panic 或截断"]
misconceptions = ["以为关联类型可以随口起名", "以为 TryFrom 和 From 只是多一个参数"]
