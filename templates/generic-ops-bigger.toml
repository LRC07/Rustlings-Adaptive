# 批次一 #11a（M4.5d）：泛型运算 ×1：PartialOrd 约束（easy）
id = "generic-ops-bigger"
title = "泛型运算：比较需要声明 PartialOrd"
concepts = ["generics.functions"]
error_codes = ["E0369", "E0277"]
difficulty = "easy"
constraints = ["no-clone", "max-lines=40"]
confusion = "Python 的泛型比较在运行时才查鸭子；Java 用 Comparable 接口。Rust 的泛型参数默认「什么都不会」——用 > 之前必须声明 PartialOrd，这是 E0369 的第一课"
anti_patterns = ["hardcode-types", "clone-to-compare"]

body = '''
// bigger 想对「能比较的」类型都工作 —— 对泛型 T 直接用 > 会
// E0369（binary operation `>` cannot be applied）。
//
// TODO: 给 T 加上让 > 可用的约束（std::cmp::PartialOrd）。
//       只改签名一行，函数体不动。
pub fn bigger<T>(a: T, b: T) -> T {
    if a > b {
        a
    } else {
        b
    }
}
// I AM NOT DONE
'''

tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn bigger_numbers() {
        assert_eq!(bigger(3, 7), 7);
    }

    #[test]
    fn bigger_strings() {
        assert_eq!(bigger("apple", "banana"), "banana");
    }
}
'''

reference = '''
pub fn bigger<T: PartialOrd>(a: T, b: T) -> T {
    if a > b {
        a
    } else {
        b
    }
}
'''
