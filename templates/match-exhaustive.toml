# 批次一 #4a（M4.5d）：模式匹配 ×1：穷尽性（E0004）
id = "match-exhaustive"
title = "模式匹配：match 必须穷尽所有变体"
concepts = ["patterns.basics"]
error_codes = ["E0004"]
difficulty = "easy"
constraints = ["no-clone", "max-lines=40"]
confusion = "C/Java 的 switch 漏分支只是被 default 静默兜底的逻辑 bug；Rust 把「漏变体」变成编译错误 E0004，初学者第一次见到会以为是自己语法写错了"
anti_patterns = ["wildcard-catch-all"]
hints = ["E0004 会指出漏掉的变体。", "Yellow 的等待秒数看测试的期望值。", "不要用 _ 兜底——穷尽才是本题的意义。"]

body = '''
// 红绿灯各方向的等待秒数。编译器说 match 不完整（E0004）。
//
// TODO: 补上缺失的分支。不要用 _ 兜底——
//       以后新增变体时，穷尽 match 会逼你处理它。
#[derive(Debug, PartialEq)]
pub enum Light {
    Red,
    Yellow,
    Green,
}

pub fn seconds(l: &Light) -> u32 {
    match l {
        Light::Red => 30,
        Light::Green => 45,
    }
}
// I AM NOT DONE
'''

tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn all_lights() {
        assert_eq!(seconds(&Light::Red), 30);
        assert_eq!(seconds(&Light::Yellow), 3);
        assert_eq!(seconds(&Light::Green), 45);
    }

    #[test]
    fn yellow_is_short() {
        assert!(seconds(&Light::Yellow) < seconds(&Light::Green));
    }
}
'''

reference = '''
#[derive(Debug, PartialEq)]
pub enum Light {
    Red,
    Yellow,
    Green,
}

pub fn seconds(l: &Light) -> u32 {
    match l {
        Light::Red => 30,
        Light::Yellow => 3,
        Light::Green => 45,
    }
}
'''


[review_hints]
root_cause = [
    "match 必须穷尽枚举的所有变体：每个分支单独处理，未来新增变体时编译器强制补逻辑——这正是题目不让用 _ 兜底的原因",
    "分支是表达式，返回类型一致即可（红黄绿各返回自己的秒数）",
]
misconceptions = [
    "以为 match 像 switch 可以 default 兜底（_ 会吞掉未来新变体的编译期检查）",
    "以为「非穷尽」报错是坏事（它是重构安全网）",
    "以为分支必须返回相同字面量（类型一致即可，值随意）",
]
