    let score = &mut p.score;
    name.push_str("（会员）");
    *score += {{bonus}};
}
'''

[[slots]]
name = "bonus"
kind = "literal"
values = ["50", "100", "200"]
default = "50"

[[slots]]
name = "who"
kind = "literal"
values = ["小王", "Alex", "阿花"]
default = "小王"

[[slots]]
name = "base"
kind = "literal"
values = ["1000", "2500", "80"]
default = "1000"

[review_hints]
root_cause = ["&mut self 借用覆盖整个结构体，两个方法调用即两次可变借用", "对不同字段的 &mut 借用互不重叠，编译器允许同时存在"]
misconceptions = ["以为任何两次可变借用都互斥", "以为方法比字段访问更“安全”"]
