# 概念图谱（细轨锚点，设计文档 v3 §7.2 / §6）
#
# 每个节点：
#   id           点分 id（如 borrow.split-fields）
#   name         中文显示名
#   parents      上位概念（图边向上，可多父，必须无环）
#   error_codes  该概念缺失时常触发的 rustc 错误码（与粗轨互为校验，多对多）
#   fix_patterns 常见修复模式标识（M5/M6 使用）
#
# 注意：节点的 templates 字段不在这里维护 —— 加载时由 template.concepts
# 反向填充（template::load_dir + taxonomy::ConceptGraph::link_templates）。

[[concept]]
id = "ownership"
name = "所有权"

[[concept]]
id = "ownership.move"
name = "所有权移动（move）"
parents = ["ownership"]
error_codes = ["E0382", "E0505", "E0507", "E0373"]
fix_patterns = ["borrow-instead-of-move", "move-into-closure"]

[[concept]]
