# rustlings-adaptive 模型配置
#
# 快速开始：
#   1. 把本文件复制为 config.toml（已 gitignore，不会泄露 Key）
#   2. 填好下面"必填"三项
#   3. cargo run，开始对话
#
# 也可以用 .env（RUSTLINGS_API_KEY / RUSTLINGS_ENDPOINT / RUSTLINGS_MODEL，
# 优先级更高），或运行后 /config 交互修改。

# ---- 必填：任意 OpenAI 兼容端点（OpenAI / DeepSeek / Kimi / Ollama / vLLM…）----

endpoint = "https://api.openai.com/v1"

api_key = ""

model = "gpt-4o-mini"

# ---- 可选：都有合理默认，通常不用动 ----

# 上下文窗口（tokens）
# context_len = 128000

# 每次请求超时秒数（默认 480）；出题的长输出在慢端点上可调高
# llm_timeout_secs = 480

# 思考模式与推理强度——质量与时间的权衡：越强越慢、越贵。
#   think_mode        auto = 沿用端点默认（拿不准就用它）
#                     on   = 强制开思考（解释更深，适合答疑）
#                     off  = 强制关（最快，正确性由本地质量门兜底）
#   reasoning_effort  low / high / max（仅思考开启时有效）
# 建议先保持 auto 起步，嫌慢或贵再降档。
# think_mode = "auto"
# reasoning_effort = "low"

# ---- 费用：照抄模型商定价页，程序据此记账并在超预算时拦截 ----

[prices]
input = 0.15      # 每 1M 输入 token
output = 0.60     # 每 1M 输出 token

[budget]
usd = 5.0         # 累计花费达到即拦截；删掉整段 = 不设预算

# ---- 推荐：常用模型各配一个档案，/model <名> 一键切换 ----
# api_key 留空 = 沿用顶层 Key；llm_timeout_secs / prices 留空 = 沿用当前值。
# /model 无参数 = 列出全部档案（* 标记当前）。

[[models]]
name = "openai"
endpoint = "https://api.openai.com/v1"
api_key = ""
model = "gpt-4o-mini"

[[models]]
name = "local"
endpoint = "http://localhost:11434/v1"
model = "qwen2.5:7b"

# 需要另一个云上模型时照这个样子加（示例 DeepSeek）：
