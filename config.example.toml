# rustlings-adaptive 模型配置
#
# ─────────────────────────────────────────────────────────────────
# 校内同学（清华）零成本上手：
#   1. 登录 https://easycompute.cs.tsinghua.edu.cn/login 领取学校
#      发放的免费 token 额度
#   2. 在聚合平台 https://ai.paratera.com/#/lms/api 创建 API Key
#   3. 把 Key 粘到下面任一位置：
#      a) 推荐：项目根目录建 .env，写一行 RUSTLINGS_API_KEY=sk-...
#         （一处覆盖全部档案，切换模型后依然生效）
#      b) 或逐档案填 api_key = ""
#   4. cp config.example.toml config.toml，cargo run 即可
# 其他来源：任意 OpenAI 兼容端点皆可（OpenAI / DeepSeek / Kimi 官方 /
# Ollama / vLLM…），照下面的通用示例加一个档案即可。
# ─────────────────────────────────────────────────────────────────
#
# 通用档案示例（OpenAI 官方；取消注释并填入你自己的 Key 即可用）：
# [[models]]
# name = "OpenAI"
# endpoint = "https://api.openai.com"
# api_key = ""                               # 建议走 .env（见顶部说明）
# model = "gpt-4o-mini"
# context_len = 128000                       # 上下文窗口（tokens）
# prices = { input = 0.15, output = 0.60 }   # 每 1M token 价格（USD），请按平台价格页核对
# think_mode = "off"
#
# 配置概念只有一个：档案（[[models]]）。
#   - 程序使用 active 指向的档案；/model <名> 切换 = 移动指针
#   - [routing]（可选）把不同环节交给不同模型，见下方说明
#   - 每个模型在文件里只出现一次，没有隐藏的继承规则
#
# 【不同环节需要什么样的模型】
#   对话：响应快、成本低——这是高频环节，快和省最重要；
#         想要讲解更厚、爱举例子可换 MiniMax-M3
#   出题·模板路径：响应快、成本低——选题/填槽/改编是小型结构化
#         调用（选题几十 tok），实测任何便宜模型都能做对，用贵模型
#         纯属浪费
#   出题·自由生成：能力强——无模板兜底的长输出创作，题目质量与
#         截断/超时问题都集中在这层；低频环节（每道题才用一次），
#         贵一点值得，且可单独配档案与超时、不拖累模板路径
#   评审 / 复盘：能力强——要能细致评判你的解法、把道理讲透，
#                可以慢一点（每道题结束时才用一次）

active = "Qwen3.8-Flash"

# 分场景路由（可选）：把某个环节交给哪个档案；各字段都可省略——
# chat/generate/review 省略 = 沿用 active，generate_free 省略 =
# 沿用 generate。
[routing]
chat = "Qwen3.8-Flash"      # 对话 / 工具环 / 假设实验室
generate = "Qwen3.8-Flash"  # 出题·模板路径（选题/填槽/改编，小而快）
generate_free = "GLM-5.3-Flash-High"  # 出题·自由生成（实测选型胜出；省略 = 沿用上一档）
review = "Kimi-K3"          # 评审门 + 复盘

# ---- 主力：对话 + 出题·模板路径（响应快、成本低，日常使用推荐）----
[[models]]
name = "Qwen3.8-Flash"
endpoint = "https://llmapi.paratera.com"
api_key = ""                               # 建议走 .env（见顶部说明）
model = "Qwen3.8-Flash"
context_len = 1000000                      # 上下文窗口（tokens）
prices = { input = 0.03, output = 0.20 }   # 每 1M token 价格（USD），请按平台价格页核对
think_mode = "off"                         # auto = 沿用端点默认 | on | off
# reasoning_effort = "low"                 # 仅思考开启时有效（low/high/max）
# llm_timeout_secs = 480                   # 单次请求超时（慢端点可调高）
# stream = true                            # 流式打字机；端点异常可设 false

# ---- 备选：讲解更厚、爱举例子的对话教练（想换教学风格时用）----
[[models]]
name = "MiniMax-M3"
endpoint = "https://llmapi.paratera.com"
api_key = ""
model = "MiniMax-M3"
context_len = 192000
prices = { input = 0.30, output = 1.20 }   # 请按平台价格页核对

# ---- 评审 + 复盘（能力强：评判细致、讲解透彻；响应稍慢）----
[[models]]
name = "Kimi-K3"
endpoint = "https://llmapi.paratera.com"
api_key = ""
model = "Kimi-K3"
context_len = 1000000
prices = { input = 2.82, output = 14.08 }  # 请按平台价格页核对
think_mode = "on"
reasoning_effort = "low"

# ---- 备选：另一个快速的对话模型（不同模型各有所长）----
[[models]]
name = "GLM-5.3-Flash"
endpoint = "https://llmapi.paratera.com"
api_key = ""
model = "GLM-5.3-Flash"
context_len = 200000
prices = { input = 0.10, output = 0.40 }   # 请按平台价格页核对
think_mode = "on"
reasoning_effort = "low"

# ---- 出题·自由生成（推理强度 high——多轮实测该层选型胜出；reasoning_effort
#      是档案级属性，对话用 low、自由生成用 high，故分开两个档案）----
[[models]]
name = "GLM-5.3-Flash-High"
endpoint = "https://llmapi.paratera.com"
api_key = ""
model = "GLM-5.3-Flash"
context_len = 200000
prices = { input = 0.10, output = 0.40 }   # 请按平台价格页核对
think_mode = "on"
reasoning_effort = "high"

# ---- 全局设置（不属于任何模型）----

# 累计花费达到即拦截所有模型调用；删掉整段 = 不设预算
[budget]
usd = 10.0

# 练习编辑器（缺省自动：$EDITOR → $VISUAL → code --wait → vi）
# editor = "code --wait"
