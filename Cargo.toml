[package]
name = "my_rustlings"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde", "clock"] }
dotenvy = "0.15.7"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ctrlc = "3.4.7"
thiserror = "2.0.20"
toml = "1.1.5"
unicode-width = "0.2"

# Unix-only: flush stale terminal input after long waits (editor /
# interrupted tasks) so buffered keystrokes never execute as commands.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `exercises` is an IDE-only sub-crate: its modules are gated behind
# `#[cfg(rust_analyzer)]`, so cargo sees an empty lib there while
# rust-analyzer gets full analysis of every exercise file. It is excluded
# from default cargo commands so it never interferes with the CLI.
[workspace]
members = ["exercises", "rustlings_official/rustlings"]
default-members = ["."]
